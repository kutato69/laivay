<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng tính lãi vay</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#667085;--bd:#dfe3e8;--ac:#0f6e56;--ac2:#e3f4ee;--hd:#eef1f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232a;--tx:#e7eaee;--mut:#9aa4b0;--bd:#2f3740;--ac:#3dbb94;--ac2:#18332b;--hd:#262d35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1d232a;--tx:#e7eaee;--mut:#9aa4b0;--bd:#2f3740;--ac:#3dbb94;--ac2:#18332b;--hd:#262d35;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;min-height:44px}
.methods{display:grid;gap:8px;margin:14px 0}
.m{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer}
.m input{width:auto;margin-top:4px}
.m.on{border-color:var(--ac);background:var(--ac2)}
.m b{display:block}.m span{color:var(--mut);font-size:13px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;min-height:46px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:var(--card);color:var(--ac);border:1.5px solid var(--ac)}
button[hidden]{display:none}
#st{font-size:13px;color:var(--mut)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sum div{background:var(--ac2);border-radius:10px;padding:10px 12px}
.sum small{color:var(--mut);display:block;font-size:12px}
.sum strong{font-size:17px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:700px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{background:var(--hd);position:sticky;top:0;font-size:13px}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:center}
tfoot td{font-weight:700;background:var(--hd)}
.note{font-size:13px;color:var(--mut);margin-top:8px}
@media (max-width:640px){
.wrap{padding:14px 10px 32px}
h1{font-size:19px}
.card{padding:12px}
.grid{grid-template-columns:1fr 1fr}
.grid>div:first-child{grid-column:1/-1}
.btns button{flex:1 1 0}
.sum{grid-template-columns:1fr 1fr}
.card.tw{background:none;border:0;padding:0;overflow:visible}
table,tbody,tfoot{display:block;min-width:0}
thead{display:none}
tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
td,tfoot td{display:block;border:0;padding:0;text-align:left!important;white-space:normal;background:none}
td::before{content:attr(data-label);display:block;font-size:11px;color:var(--mut)}
td:empty{display:none}
tbody td:nth-child(1){font-weight:700;color:var(--ac)}
tbody td:nth-child(6){grid-column:1/-1;font-weight:700;font-size:17px;background:var(--ac2);border-radius:8px;padding:6px 8px}
tfoot tr{border-color:var(--ac)}
tfoot td:first-child{grid-column:1/-1}
tfoot td:first-child::before{content:none}
}
</style>
</head>
<body>
<div class="wrap">
<h1>Bảng tính lãi vay</h1>
<p class="sub">Chọn cách tính lãi: dư nợ giảm dần hoặc lãi cố định trên dư nợ ban đầu.</p>

<div class="card">
<div class="grid">
<div><label for="p">Số tiền vay (VNĐ)</label><input id="p" type="text" inputmode="numeric" value="500.000.000"></div>
<div><label for="r">Lãi suất (%/năm)</label><input id="r" type="number" step="0.01" value="10"></div>
<div><label for="n">Thời hạn (tháng)</label><input id="n" type="number" min="1" max="600" value="12"></div>
<div><label for="d">Ngày giải ngân</label><input id="d" type="date"></div>
</div>
<div class="methods" id="ms">
<label class="m on"><input type="radio" name="m" value="gd" checked><div><b>Dư nợ giảm dần – gốc trả đều</b><span>Gốc chia đều mỗi kỳ, lãi tính trên dư nợ còn lại nên tổng trả giảm dần.</span></div></label>
<label class="m"><input type="radio" name="m" value="nk"><div><b>Dư nợ giảm dần – trả đều gốc + lãi (niên kim)</b><span>Số tiền trả mỗi kỳ bằng nhau; lãi giảm dần, gốc tăng dần.</span></div></label>
<label class="m"><input type="radio" name="m" value="cd"><div><b>Lãi cố định (trên dư nợ gốc ban đầu)</b><span>Lãi mỗi kỳ không đổi, tính trên số tiền vay ban đầu dù đã trả gốc.</span></div></label>
</div>
<div class="btns"><button id="go">Tính lãi</button><button id="xl" class="sec">⬇ Tải Excel</button><span id="st"></span></div>
</div>

<div class="card">
<div class="sum" id="sum"></div>
<p class="note" id="note"></p>
</div>

<div class="card tw">
<table>
<thead><tr><th>Kỳ</th><th>Ngày trả</th><th>Dư nợ đầu kỳ</th><th>Gốc phải trả</th><th>Lãi phải trả</th><th>Tổng phải trả</th><th>Dư nợ cuối kỳ</th></tr></thead>
<tbody id="tb"></tbody>
<tfoot id="tf"></tfoot>
</table>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
var f=new Intl.NumberFormat("vi-VN");
var $=function(i){return document.getElementById(i)};
var today=new Date();$("d").value=today.toISOString().slice(0,10);
function num(s){return parseFloat(String(s).replace(/\./g,"").replace(/,/g,"."))||0}
$("p").addEventListener("input",function(){var v=num(this.value);this.value=v?f.format(v):""});
function addM(d,k){var x=new Date(d.getFullYear(),d.getMonth()+k,1);var last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(d.getDate(),last));return x}
function fd(d){return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear()}
function calc(){
var P=num($("p").value),R=parseFloat($("r").value)||0,N=Math.max(1,parseInt($("n").value)||1);
var m=document.querySelector("input[name=m]:checked").value;
var st=$("d").value?new Date($("d").value+"T00:00"):new Date();
var i=R/100/12,bal=P,rows=[],tg=0,tl=0,DT=[];
var pmt=i===0?P/N:P*i/(1-Math.pow(1+i,-N));
for(var k=1;k<=N;k++){
var lai,goc;
if(m==="gd"){lai=Math.round(bal*i);goc=k===N?bal:Math.round(P/N)}
else if(m==="nk"){lai=Math.round(bal*i);goc=k===N?bal:Math.round(pmt)-lai}
else{lai=Math.round(P*i);goc=k===N?bal:Math.round(P/N)}
var end=bal-goc;
var dt=addM(st,k);DT.push(dt);rows.push([k,fd(dt),bal,goc,lai,goc+lai,end]);
tg+=goc;tl+=lai;bal=end}
LAST={rows:rows,tg:tg,tl:tl,dt:DT,P:P,R:R,N:N,m:m,st:st};
var LB=["Kỳ","Ngày trả","Dư nợ đầu kỳ","Gốc phải trả","Lãi phải trả","Tổng phải trả","Dư nợ cuối kỳ"];
$("tb").innerHTML=rows.map(function(r){return "<tr>"+r.map(function(v,j){return "<td data-label='"+(j===0?"Kỳ":LB[j])+"'>"+(j<2?v:f.format(v))+"</td>"}).join("")+"</tr>"}).join("");
$("tf").innerHTML="<tr><td colspan='3'>Tổng cộng</td><td data-label='Tổng gốc'>"+f.format(tg)+"</td><td data-label='Tổng lãi'>"+f.format(tl)+"</td><td data-label='Tổng gốc + lãi'>"+f.format(tg+tl)+"</td><td></td></tr>";
var first=rows[0][5],lastv=rows[N-1][5];
$("sum").innerHTML=[["Tổng lãi",f.format(tl)],["Tổng gốc + lãi",f.format(tg+tl)],["Kỳ đầu phải trả",f.format(first)],["Kỳ cuối phải trả",f.format(lastv)]].map(function(a){return "<div><small>"+a[0]+"</small><strong>"+a[1]+"</strong></div>"}).join("");
var nt=m==="cd"?"Lãi cố định: lãi suất thực tế trên dư nợ giảm dần cao hơn mức "+R+"%/năm nhập vào (xấp xỉ gấp 2 lần với khoản trả gốc đều).":m==="nk"?"Niên kim: số tiền trả hằng tháng gần như bằng nhau (kỳ cuối điều chỉnh làm tròn).":"Gốc đều: tổng trả giảm dần theo từng kỳ vì lãi tính trên dư nợ còn lại.";
$("note").textContent=nt+" Lãi tính theo tháng = lãi suất năm / 12.";
}
$("go").onclick=calc;
var LAST=null,DL=null;
if(window.claude&&claude.use){claude.use("downloads").then(function(d){DL=d}).catch(function(){})}
$("xl").onclick=async function(){
if(!LAST)return;
var st=$("st"),btn=$("xl");
if(!window.ExcelJS){st.textContent="Chưa tải được thư viện Excel (cần kết nối mạng)";return}
btn.disabled=true;st.textContent="Đang tạo file...";
try{
var X=LAST,wb=new ExcelJS.Workbook();wb.creator="Bảng tính lãi vay";
var ws=wb.addWorksheet("Lịch trả nợ",{views:[{state:"frozen",ySplit:10,showGridLines:false}],pageSetup:{orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9,printTitlesRow:"10:10"}});
var G="FF0F6E56",G2="FFE3F4EE",G3="FFF4FAF7",GR="FFF3F4F6",BD={style:"thin",color:{argb:"FFD0D7DE"}},B={top:BD,left:BD,bottom:BD,right:BD};
var W=[8,14,20,18,18,20,20];W.forEach(function(w,i){ws.getColumn(i+1).width=w});
ws.mergeCells("A1:G1");var t=ws.getCell("A1");t.value="BẢNG TÍNH LÃI VAY";t.font={name:"Arial",size:20,bold:true,color:{argb:G}};t.alignment={horizontal:"left",vertical:"middle"};ws.getRow(1).height=34;
ws.mergeCells("A2:G2");var s=ws.getCell("A2");s.value="Lịch trả nợ chi tiết theo từng kỳ";s.font={name:"Arial",size:10,italic:true,color:{argb:"FF667085"}};
for(var c=1;c<=7;c++){ws.getCell(3,c).border={bottom:{style:"medium",color:{argb:G}}}}
var MN={gd:"Dư nợ giảm dần – gốc trả đều",nk:"Dư nợ giảm dần – niên kim (gốc + lãi đều)",cd:"Lãi cố định trên dư nợ gốc ban đầu"};
var info=[["Số tiền vay (VNĐ)",X.P,"#,##0"],["Lãi suất (%/năm)",X.R/100,"0.00%"],["Thời hạn (tháng)",X.N,"0"],["Ngày giải ngân",X.st,"dd/mm/yyyy"],["Phương thức tính lãi",MN[X.m],"@"]];
info.forEach(function(a,i){var r=4+i;ws.mergeCells(r,1,r,2);ws.mergeCells(r,3,r,5);
var l=ws.getCell(r,1),v=ws.getCell(r,3);l.value=a[0];v.value=a[1];v.numFmt=a[2];
l.font={name:"Arial",size:10,bold:true,color:{argb:"FF344054"}};l.fill={type:"pattern",pattern:"solid",fgColor:{argb:GR}};
v.font={name:"Arial",size:10,bold:true};v.alignment={horizontal:"left"};
for(var c=1;c<=5;c++)ws.getCell(r,c).border=B});
var H=["Kỳ","Ngày trả","Dư nợ đầu kỳ","Gốc phải trả","Lãi phải trả","Tổng phải trả","Dư nợ cuối kỳ"];
var hr=ws.getRow(10);hr.height=30;
H.forEach(function(h,i){var c=hr.getCell(i+1);c.value=h;c.font={name:"Arial",size:10,bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:G}};c.alignment={horizontal:"center",vertical:"middle",wrapText:true};c.border=B});
X.rows.forEach(function(r,i){var n=11+i,row=ws.getRow(n);
row.getCell(1).value=r[0];row.getCell(2).value=X.dt[i];
row.getCell(3).value=i===0?{formula:"$C$4",result:r[2]}:{formula:"G"+(n-1),result:r[2]};
row.getCell(4).value=r[3];row.getCell(5).value=r[4];
row.getCell(6).value={formula:"D"+n+"+E"+n,result:r[5]};
row.getCell(7).value={formula:"C"+n+"-D"+n,result:r[6]};
for(var c=1;c<=7;c++){var x=row.getCell(c);x.font={name:"Arial",size:10,bold:c===6};x.border=B;
if(i%2===1)x.fill={type:"pattern",pattern:"solid",fgColor:{argb:G3}};
if(c===1||c===2)x.alignment={horizontal:"center"};else{x.numFmt="#,##0";x.alignment={horizontal:"right"}}
if(c===2)x.numFmt="dd/mm/yyyy"}});
var f1=11,fl=10+X.N,tn=fl+1,tr=ws.getRow(tn);tr.height=24;
ws.mergeCells(tn,1,tn,3);tr.getCell(1).value="TỔNG CỘNG";
[[4,X.tg],[5,X.tl],[6,X.tg+X.tl]].forEach(function(a){var L=String.fromCharCode(64+a[0]);tr.getCell(a[0]).value={formula:"SUM("+L+f1+":"+L+fl+")",result:a[1]}});
for(var c=1;c<=7;c++){var y=tr.getCell(c);y.font={name:"Arial",size:11,bold:true,color:{argb:G}};y.fill={type:"pattern",pattern:"solid",fgColor:{argb:G2}};y.border={top:{style:"medium",color:{argb:G}},bottom:{style:"medium",color:{argb:G}},left:BD,right:BD};y.alignment={horizontal:c===1?"center":"right",vertical:"middle"};if(c>3)y.numFmt="#,##0"}
ws.getCell(tn+2,1).value="Lưu ý: lãi tháng = lãi suất năm / 12; số liệu làm tròn đến đồng. Kết quả chỉ mang tính tham khảo.";
ws.getCell(tn+2,1).font={name:"Arial",size:9,italic:true,color:{argb:"FF667085"}};
var buf=await wb.xlsx.writeBuffer();
var o={filename:"lich-tra-no.xlsx",data:buf};
if(DL){await DL.save(o)}else{var b=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();a.remove()}
st.textContent="Đã lưu file Excel";
}catch(e){st.textContent=e&&e.code==="declined"?"":"Không tạo được file Excel"}
btn.disabled=false;
};
document.querySelectorAll("input[name=m]").forEach(function(e){e.addEventListener("change",function(){document.querySelectorAll(".m").forEach(function(x){x.classList.toggle("on",x.querySelector("input").checked)});calc()})});
["r","n","d","p"].forEach(function(id){$(id).addEventListener("input",calc)});
calc();
</script>
</body>
</html>
